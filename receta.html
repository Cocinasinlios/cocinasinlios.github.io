<meta name="description" content="Receta práctica de Cocina sin líos con ingredientes, pasos, sustituciones, aprovechamiento y una técnica que aprender.">

<link rel="canonical" href="https://cocinasinlios.com/receta.html">

<style>
:root{--cream:#fbf6ee;--paper:#fffdfa;--ink:#25251f;--muted:#706f67;--dark:#274034;--sage:#dce8d8;--mint:#eef5eb;--peach:#f1d8c6;--butter:#f2df9d;--terr:#c97a58;--line:#e8dfd2;--shadow:0 18px 55px rgba(58,51,42,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.58;padding-bottom:76px}a{color:inherit;text-decoration:none}.wrap{width:min(1080px,92vw);margin:auto}h1,h2,h3{font-family:Georgia,serif;font-weight:500;line-height:1.05}.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.45px;text-transform:uppercase;color:#687769}
header{position:sticky;top:0;z-index:40;background:rgba(251,246,238,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{height:76px;display:flex;align-items:center;gap:22px}.brand img{width:185px}.navlinks{margin-left:auto;display:flex;gap:18px;font-size:13px;font-weight:800}
.hero{padding:58px 0 42px}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}.hero h1{font-size:clamp(48px,7vw,82px);letter-spacing:-2.4px;margin:8px 0 14px}.intro{font-size:18px;color:var(--muted);max-width:690px}.hero-photo{min-height:430px;border-radius:32px;background-color:#eee;background-image:url('/assets/sprite.webp');background-size:300% 200%;background-position:0 0;background-repeat:no-repeat;box-shadow:var(--shadow)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--dark);background:transparent;color:var(--dark);border-radius:999px;padding:11px 15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--dark);color:#fff}.btn.saved{background:var(--sage);border-color:var(--sage)}
.section{padding:66px 0}.paper{background:var(--paper)}.recipe-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:26px}.box{border:1px solid var(--line);border-radius:26px;padding:25px;background:white}.box h2{font-size:34px;margin:5px 0 18px}.ingredients{list-style:none;padding:0;margin:0}.ingredients li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.ingredients li:last-child{border-bottom:0}.steps{display:grid;gap:12px}.step{display:grid;grid-template-columns:42px 1fr;gap:13px;padding:15px;border-radius:20px;background:var(--paper)}.step-num{width:42px;height:42px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px}.step h3{font-size:23px;margin:0 0 5px}.step p{margin:0;color:var(--muted);font-size:14px}
.learn{background:var(--butter);border-radius:28px;padding:30px}.learn h2{font-size:40px;margin:6px 0 11px}.learn p{max-width:760px;color:#655d4b}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.info{border:1px solid var(--line);border-radius:24px;padding:22px;background:white}.info:nth-child(2){background:var(--mint)}.info:nth-child(3){background:var(--peach)}.info h3{font-size:28px;margin:6px 0 10px}.info ul{padding-left:18px;margin:0}.info li{font-size:13px;color:var(--muted);margin:8px 0}
.next{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:var(--dark);color:white;border-radius:28px;padding:30px}.next h2{font-size:36px;margin:5px 0}.next p{color:#c9d5cd;margin:0}.next .btn{border-color:white;color:white}
footer{background:#202b24;color:#dce5df;padding:40px 0;margin-top:25px}footer p{font-size:12px;color:#aebbb3}.global-dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:120;background:rgba(34,43,37,.95);color:#fff;border-radius:18px;padding:5px;display:flex;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.18)}.global-dock a{min-width:68px;text-align:center;padding:7px 8px;border-radius:13px;font-size:9px;font-weight:850}.global-dock a span{display:block;font-size:15px}.empty{padding:90px 0;text-align:center}.empty h1{font-size:55px}
@media(max-width:820px){.hero-grid,.recipe-grid{grid-template-columns:1fr}.hero-photo{min-height:340px}.three{grid-template-columns:1fr}.navlinks{display:none}.next{grid-template-columns:1fr}.brand img{width:165px}}
@media(max-width:580px){.hero{padding-top:38px}.hero h1{font-size:48px}.global-dock{left:10px;right:10px;transform:none}.global-dock a{min-width:0;flex:1;padding:6px 3px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="/"><img src="/assets/logo-cocina-sin-lios.svg" alt="Cocina sin líos con Macarena"></a><nav class="navlinks"></nav></div></header>
<main id="app"></main>
<footer><div class="wrap"><b>Cocina sin líos con Macarena</b><p>Recetas domésticas orientativas. Ajusta cantidades, alérgenos, tiempos y punto de cocción a los ingredientes y necesidades de tu casa.</p></div></footer>
<div class="global-dock"></div>
<script src="/assets/recipes-data.js"></script>
<script>
(()=>{
 const slug=new URLSearchParams(location.search).get("r")||"";
 const recipes=window.CSL_RECIPES||[];
 const r=recipes.find(x=>x.slug===slug);
 const app=document.getElementById("app");
 const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
 if(!r){
   app.innerHTML='<section class="empty"><div class="wrap"><div class="eyebrow">Recetas</div><h1>No encuentro esa receta.</h1><p><a class="btn primary" href="/recetas.html">Volver a la biblioteca</a></p></div></section>';
   return;
 }
 document.title=r.title+" | Cocina sin líos con Macarena";
 const desc=r.intro.slice(0,155);
 document.querySelector('meta[name="description"]').setAttribute("content",desc);
 const canonical="https://cocinasinlios.com/receta.html?r="+encodeURIComponent(r.slug);
 document.querySelector('link[rel="canonical"]').setAttribute("href",canonical);
 const ogTitle=document.createElement("meta");ogTitle.setAttribute("property","og:title");ogTitle.content=r.title+" | Cocina sin líos";document.head.appendChild(ogTitle);
 const ogDesc=document.createElement("meta");ogDesc.setAttribute("property","og:description");ogDesc.content=desc;document.head.appendChild(ogDesc);
 const ogUrl=document.createElement("meta");ogUrl.setAttribute("property","og:url");ogUrl.content=canonical;document.head.appendChild(ogUrl);
 if(r.image)document.querySelector('meta[property="og:image"]').content="https://cocinasinlios.com"+r.image;
 const schema=document.createElement("script");schema.type="application/ld+json";schema.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Recipe","name":r.title,"description":r.intro,"recipeYield":r.servings,"totalTime":"PT"+Math.max(1,r.minutes)+"M","recipeIngredient":r.ingredients,"recipeInstructions":r.steps.map(x=>({"@type":"HowToStep","name":x.t,"text":x.x})),"author":{"@type":"Person","name":"Macarena"},"url":canonical});document.head.appendChild(schema);
 const photoStyle=r.image?"background-image:url('"+r.image+"');background-size:cover;background-position:center":"background-position:"+(r.sprite||"0 0");
 app.innerHTML=
 '<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">'+esc(r.category)+'</div><h1>'+esc(r.title)+'</h1><p class="intro">'+esc(r.intro)+'</p><div class="meta"><span class="pill">⏱ '+esc(r.time)+'</span><span class="pill">🍽 '+esc(r.servings)+'</span><span class="pill">'+esc(r.difficulty)+'</span></div><div class="actions"><button id="fav" class="btn" type="button">♡ Guardar</button><button id="week" class="btn primary" type="button">Llevar a mi semana</button><button id="share" class="btn" type="button">Compartir</button></div></div><div class="hero-photo" style="'+photoStyle+'" role="img" aria-label="'+esc(r.title)+'"></div></div></section>'+
 '<section class="section paper"><div class="wrap recipe-grid"><div class="box"><div class="eyebrow">Ingredientes</div><h2>Lo que necesitas.</h2><ul class="ingredients">'+r.ingredients.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div><div class="box"><div class="eyebrow">Paso a paso</div><h2>Hazlo sin complicarte.</h2><div class="steps">'+r.steps.map((x,i)=>'<div class="step"><div class="step-num">'+(i+1)+'</div><div><h3>'+esc(x.t)+'</h3><p>'+esc(x.x)+'</p></div></div>').join("")+'</div></div></div></section>'+
 '<section class="section"><div class="wrap"><div class="learn"><div class="eyebrow">Lo importante</div><h2>'+esc(r.learn.t)+'</h2><p>'+esc(r.learn.x)+'</p></div></div></section>'+
 '<section class="section paper"><div class="wrap three"><div class="info"><div class="eyebrow">Si te falta algo</div><h3>Sustituciones</h3><ul>'+r.substitutions.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div><div class="info"><div class="eyebrow">Nada se tira</div><h3>Aprovecha después</h3><ul>'+r.reuse.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div><div class="info"><div class="eyebrow">Mi consejo</div><h3>Para que salga mejor</h3><ul>'+r.tips.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div></div></section>'+
 '<section class="section"><div class="wrap"><div class="next"><div><div class="eyebrow" style="color:#b9c9bc">Siguiente decisión</div><h2>¿La quieres dentro de tu semana?</h2><p>La guardo como punto de partida y completo las otras cuatro cenas alrededor.</p></div><button id="week2" class="btn" type="button">Añadir al plan →</button></div></div></section>';
 const favKey="csl-favoritos-v1";
 let favs=[];try{favs=JSON.parse(localStorage.getItem(favKey)||"[]")}catch(e){}
 const favId=r.id||r.slug;
 const syncFav=()=>{document.querySelectorAll("#fav").forEach(b=>{const on=favs.includes(favId);b.textContent=on?"♥ Guardada":"♡ Guardar";b.classList.toggle("saved",on)})};syncFav();
 document.getElementById("fav").addEventListener("click",()=>{favs=favs.includes(favId)?favs.filter(x=>x!==favId):[...favs,favId];try{localStorage.setItem(favKey,JSON.stringify(favs))}catch(e){}syncFav()});
 function addWeek(btn){try{localStorage.setItem("csl-idea-semana-v1",JSON.stringify({n:r.title,slug:r.slug,...r.plan}));btn.textContent="Añadida ✓";btn.classList.add("saved");setTimeout(()=>location.href="/plan-semana.html?idea=1",220)}catch(e){location.href="/plan-semana.html"}}
 document.getElementById("week").addEventListener("click",e=>addWeek(e.currentTarget));
 document.getElementById("week2").addEventListener("click",e=>addWeek(e.currentTarget));
 document.getElementById("share").addEventListener("click",async e=>{try{if(navigator.share)await navigator.share({title:r.title,text:r.intro,url:canonical});else{await navigator.clipboard.writeText(r.title+" · "+canonical);e.currentTarget.textContent="Enlace copiado ✓"}}catch(err){}});
})();
</script>
<script src="/assets/site.js" defer></script>
</body>
</html>
