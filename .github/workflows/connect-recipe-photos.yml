name: Connect recipe photos

on:
  push:
    paths:
      - "assets/recipes/*.webp"
      - "scripts/connect_recipe_images.py"
      - ".github/workflows/connect-recipe-photos.yml"

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Connect photos to recipe metadata
        run: python scripts/connect_recipe_images.py
      - name: Validate public site
        run: python scripts/qa.py
      - name: Commit photo and metadata updates
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No photo or metadata changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recipes assets/recipes-data.js recetas sitemap.xml
          git commit -m "Connect uploaded recipe photos"
          git push
