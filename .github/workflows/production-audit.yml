name: Production audit

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/internal/**"
  workflow_dispatch:

concurrency:
  group: production-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deploy
        run: sleep 45

      - name: Resolve production URLs
        shell: bash
        run: |
          mkdir -p audit
          {
            for url in \
              "https://cocinasinlios.com/" \
              "https://www.cocinasinlios.com/" \
              "https://cocinasinlios.com/que-cocino" \
              "https://cocinasinlios.com/que-cenar-hoy" \
              "https://cocinasinlios.com/plan-semana" \
              "https://cocinasinlios.com/recetas" \
              "https://cocinasinlios.com/mi-rincon" \
              "https://cocinasinlios.com/explora" \
              "https://cocinasinlios.com/con-macarena" \
              "https://cocinasinlios.com/criterio-editorial" \
              "https://cocinasinlios.com/despensa-sin-lios" \
              "https://cocinasinlios.com/cenas-en-15-minutos" \
              "https://cocinasinlios.com/cenas-sin-ganas-de-cocinar" \
              "https://cocinasinlios.com/cenas-de-despensa" \
              "https://cocinasinlios.com/cocinar-una-vez-comer-dos-dias" \
              "https://cocinasinlios.com/recetas-con-tomate" \
              "https://cocinasinlios.com/recetas-con-calabacin" \
              "https://cocinasinlios.com/recetas-con-arroz" \
              "https://cocinasinlios.com/que-cocinar-con-huevos" \
              "https://cocinasinlios.com/que-hacer-con-pollo-cocido" \
              "https://cocinasinlios.com/que-hacer-con-garbanzos-cocidos" \
              "https://cocinasinlios.com/recetas.html"; do
              echo "$url"
              curl -sS -o /dev/null -w "status=%{http_code}\nfinal=%{url_effective}\ntime=%{time_total}\n" -L "$url"
              echo
            done
            echo "ROBOTS"
            curl -sS -o /dev/null -w "status=%{http_code}\n" https://cocinasinlios.com/robots.txt
            echo "SITEMAP"
            curl -sS -o /dev/null -w "status=%{http_code}\n" https://cocinasinlios.com/sitemap.xml
            echo "IMAGE SITEMAP"
            curl -sS -o /dev/null -w "status=%{http_code}\n" https://cocinasinlios.com/image-sitemap.xml
          } | tee audit/urls.txt

      - name: Verify search crawler access
        shell: bash
        run: |
          set -e
          DESKTOP_UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          MOBILE_UA='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/41.0.2272.96 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          for ua in "$DESKTOP_UA" "$MOBILE_UA"; do
            for url in               "https://cocinasinlios.com/"               "https://cocinasinlios.com/robots.txt"               "https://cocinasinlios.com/sitemap.xml"               "https://cocinasinlios.com/image-sitemap.xml"               "https://cocinasinlios.com/que-cocino"; do
              status="$(curl -A "$ua" -sS -L -o /dev/null -w '%{http_code}' "$url")"
              echo "$status $url"
              test "$status" = "200"
            done
          done

      - name: Verify SEO landing metadata
        shell: bash
        run: |
          set -e
          for url in \
            "https://cocinasinlios.com/que-cocino" \
            "https://cocinasinlios.com/que-cenar-hoy" \
            "https://cocinasinlios.com/recetas-aprovechamiento" \
            "https://cocinasinlios.com/cenas-en-15-minutos" \
            "https://cocinasinlios.com/cenas-sin-ganas-de-cocinar" \
            "https://cocinasinlios.com/cenas-de-despensa" \
            "https://cocinasinlios.com/cocinar-una-vez-comer-dos-dias" \
            "https://cocinasinlios.com/recetas-con-tomate" \
            "https://cocinasinlios.com/recetas-con-calabacin" \
            "https://cocinasinlios.com/recetas-con-arroz" \
            "https://cocinasinlios.com/que-cocinar-con-huevos" \
            "https://cocinasinlios.com/que-hacer-con-pollo-cocido" \
            "https://cocinasinlios.com/que-hacer-con-garbanzos-cocidos"; do
            html="$(curl -sS -L --fail "$url")"
            headers="$(curl -sS -I -L "$url" | tr -d '\r')"
            if echo "$headers" | grep -Eiq '^x-robots-tag:.*noindex'; then
              echo "Unexpected X-Robots-Tag noindex: $url" >&2
              exit 1
            fi
            echo "$html" | grep -Eiq '<title>[^<]+</title>'
            echo "$html" | grep -Eiq '<link[^>]+rel=["'\'' ]*canonical|<link[^>]+href=[^>]+rel=["'\'' ]*canonical'
            echo "$html" | grep -Eiq '<h1[ >]'
            if echo "$html" | grep -Eiq '<meta[^>]+name=["'\'']robots["'\''][^>]+content=["'\''][^"'\'']*noindex'; then
              echo "Unexpected noindex: $url" >&2
              exit 1
            fi
            echo "SEO OK $url"
          done

      - name: Verify real 404 response
        shell: bash
        run: |
          status="$(curl -sS -L -o /dev/null -w '%{http_code}' https://cocinasinlios.com/esta-ruta-no-existe-csl-404)"
          echo "404 test status=$status"
          test "$status" = "404"

      - name: Snapshot security headers
        shell: bash
        run: |
          mkdir -p audit
          curl -sSI https://cocinasinlios.com/ | tee audit/security-headers.txt
          echo
          echo "Relevant headers:"
          grep -Ei '^(strict-transport-security|content-security-policy|x-content-type-options|referrer-policy|permissions-policy|x-frame-options):' audit/security-headers.txt || true

      - name: Find Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found" >&2
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Mobile production screenshots
        shell: bash
        run: |
          CHROME="${{ steps.chrome.outputs.path }}"
          declare -A PAGES=(
            [home]="https://cocinasinlios.com/"
            [que-cocino]="https://cocinasinlios.com/que-cocino"
            [recetas]="https://cocinasinlios.com/recetas"
            [planifica]="https://cocinasinlios.com/plan-semana"
            [mi-cocina]="https://cocinasinlios.com/mi-rincon"
          )
          for name in "${!PAGES[@]}"; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=390,844 --force-device-scale-factor=1 \
              --virtual-time-budget=7000 \
              --screenshot="audit/mobile-${name}.png" "${PAGES[$name]}"
          done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1440,1000 --force-device-scale-factor=1 \
            --virtual-time-budget=7000 \
            --screenshot="audit/desktop-home.png" "https://cocinasinlios.com/"

      - name: Production interaction smoke test
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          npm install --no-save puppeteer-core
          cat > /tmp/csl-smoke.cjs <<'NODE'
          const puppeteer = require(process.cwd() + "/node_modules/puppeteer-core");
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:["--no-sandbox","--disable-gpu"]});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            const errors=[];
            page.on("pageerror",e=>errors.push(String(e)));

            await page.goto("https://cocinasinlios.com/que-cocino",{waitUntil:"networkidle2"});
            await page.click("#go");
            await page.waitForSelector("#results.show",{timeout:8000});
            const cards=await page.evaluate(()=>document.querySelectorAll("#grid .card").length);
            if(!Number.isInteger(cards)||cards<1)throw new Error("Qué cocino no generó resultados");

            await page.goto("https://cocinasinlios.com/recetas/pasta-tomate-atun/",{waitUntil:"networkidle2"});
            await page.waitForSelector(".csl-continue",{timeout:8000});
            const recipeQuality=await page.evaluate(()=>{
              const ld=[...document.querySelectorAll('script[type="application/ld+json"]')].map(x=>x.textContent).find(x=>x.includes('"@type":"Recipe"'))||"";
              return {
                hero:document.querySelector(".hero-photo img")?.getAttribute("src")||"",
                editorial:!!document.querySelector('a[href="/criterio-editorial"]'),
                stepId:document.querySelector(".steps .step")?.id||"",
                schemaStepUrl:ld.includes("#paso-1")
              };
            });
            if(!recipeQuality.hero.includes("/assets/recipes/pasta-tomate-atun.webp"))throw new Error("La receta no expone hero HTML indexable");
            if(!recipeQuality.editorial)throw new Error("La receta no enlaza el criterio editorial");
            if(recipeQuality.stepId!=="paso-1"||!recipeQuality.schemaStepUrl)throw new Error("Los pasos de receta no están anclados al schema");
            const recent=await page.evaluate(()=>JSON.parse(localStorage.getItem("csl-recientes-v1")||"[]"));
            if(!Array.isArray(recent)||recent[0]?.slug!=="pasta-tomate-atun")throw new Error("No se guardó la receta reciente");

            await page.goto("https://cocinasinlios.com/mi-rincon",{waitUntil:"networkidle2"});
            await page.waitForFunction(()=>getComputedStyle(document.querySelector("#recentDetail")).display!=="none",{timeout:8000});
            const recentLinks=await page.evaluate(()=>document.querySelectorAll("#recentList .recent-item").length);
            if(!Number.isInteger(recentLinks)||recentLinks<1)throw new Error("Mi cocina no muestra recetas recientes");

            if(errors.length)throw new Error("Errores JS en producción: "+errors.join(" | "));
            require("fs").writeFileSync("audit/smoke.txt","OK\nQué cocino: "+cards+" resultados\nHero de receta: HTML indexable\nCriterio editorial: enlazado\nReceta reciente: OK\nMi cocina recientes: "+recentLinks+"\n");
            console.log("Production smoke test OK");
            await browser.close();
          })().catch(async e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/csl-smoke.cjs

      - name: Lighthouse mobile
        shell: bash
        run: |
          npm install --global lighthouse
          lighthouse https://cocinasinlios.com/ \
            --quiet --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=audit/lighthouse-home.json
          lighthouse https://cocinasinlios.com/recetas \
            --quiet --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=audit/lighthouse-recetas.json
          lighthouse https://cocinasinlios.com/que-cenar-hoy \
            --quiet --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=audit/lighthouse-seo-landing.json
          lighthouse https://cocinasinlios.com/recetas/pasta-tomate-atun/ \
            --quiet --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=audit/lighthouse-recipe.json

      - name: Summarize Lighthouse
        shell: python
        run: |
          import json
          from pathlib import Path
          out=[]
          for name in ("home","recetas","seo-landing","recipe"):
              p=Path(f"audit/lighthouse-{name}.json")
              data=json.loads(p.read_text())
              cats=data["categories"]
              out.append(name.upper())
              scores={key:round(cats[key]["score"]*100) for key in ("performance","accessibility","best-practices","seo")}
              for key in ("performance","accessibility","best-practices","seo"):
                  out.append(f"{key}={scores[key]}")
              if scores["performance"] < 95:
                  raise SystemExit(f"{name}: performance por debajo de 95 ({scores['performance']})")
              for key in ("accessibility","best-practices","seo"):
                  if scores[key] < 100:
                      raise SystemExit(f"{name}: {key} ha dejado de estar en 100 ({scores[key]})")
              audits=data.get("audits",{})
              for key in ("first-contentful-paint","largest-contentful-paint","cumulative-layout-shift","total-blocking-time","speed-index"):
                  if key in audits:
                      out.append(f"{key}={audits[key].get('displayValue')}")
              failed_accessibility=[]
              for audit_id, audit in audits.items():
                  details=audit.get("details") or {}
                  if audit.get("scoreDisplayMode") in ("binary","numeric") and audit.get("score") not in (None,1):
                      group=audit.get("group")
                      if group=="a11y" or audit_id in {
                          "color-contrast","image-alt","link-name","button-name","label",
                          "html-has-lang","document-title","heading-order","target-size"
                      }:
                          failed_accessibility.append((audit_id,audit.get("title"),audit.get("score")))
              if failed_accessibility:
                  out.append("accessibility_failures="+json.dumps(failed_accessibility,ensure_ascii=False))
              out.append("")
          Path("audit/summary.txt").write_text("\n".join(out))
          print("\n".join(out))

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: production-audit
          path: audit/
          retention-days: 7
